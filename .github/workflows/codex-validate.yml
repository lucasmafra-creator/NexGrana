name: Codex - Validar e empacotar NexGrana

on:
  push:
    branches:
      - codex/revisao-nexgrana-019
    paths:
      - "project/**"
      - ".github/workflows/codex-validate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: project/requirements.txt

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: project/package.json

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Validacao Python completa
        run: python validate_release.py --full

      - name: Testes SQL e RLS
        run: |
          npm install --ignore-scripts
          npm run test:sql

  package:
    if: github.actor != 'github-actions[bot]'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar ZIP validado
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import zipfile

          root = Path("project")
          release = Path("release")
          release.mkdir(exist_ok=True)
          output = release / "NexGrana_0_19_0_SOL_Virada_RC2_VALIDADA.zip"
          ignored_dirs = {"__pycache__", ".pytest_cache", ".git", "node_modules"}
          ignored_suffixes = {".pyc", ".bak"}

          with zipfile.ZipFile(output, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in root.rglob("*"):
                  if not path.is_file():
                      continue
                  if any(part in ignored_dirs for part in path.parts):
                      continue
                  if path.suffix.lower() in ignored_suffixes:
                      continue
                  archive.write(path, Path("NexGrana_0_19_0_SOL_Virada") / path.relative_to(root))

          with zipfile.ZipFile(output) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"ZIP corrompido: {bad}")

          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          (release / "SHA256SUMS.txt").write_text(
              f"{digest}  {output.name}\n",
              encoding="utf-8",
          )
          print(f"ZIP: {output}")
          print(f"SHA256: {digest}")

      - name: Publicar ZIP na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release
          git commit -m "release: add validated NexGrana 0.19.0 RC2 package"
          git push
